<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CueKeeper</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(900px 600px at 50% 0%, rgba(34, 211, 238, .12), transparent 60%),
        #0b1220;
      color: #e6edf5;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    .card { width: min(520px, 82vw); text-align: center; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 20px;
      background-image: linear-gradient(140deg, #7dd3fc, #0e7490);
      box-shadow: 0 18px 50px rgba(14, 116, 144, .28), inset 0 0 0 1px rgba(255, 255, 255, .18);
      position: relative;
    }
    .mark::after {
      content: ""; position: absolute; inset: 21px 18px 21px 24px;
      background: #0b1220;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      border-radius: 2px;
    }
    h1 { margin: 0 0 8px; font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
    #status { margin: 0; color: #9fb0c3; white-space: pre-wrap; }
    #status.error { color: #fecaca; text-align: left; font-size: 12.5px; }
    .spinner {
      width: 22px; height: 22px; margin: 22px auto 0;
      border: 2px solid rgba(148, 197, 214, .22);
      border-top-color: #7dd3fc;
      border-radius: 999px;
      animation: spin .8s linear infinite;
    }
    .spinner[hidden] { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { margin-top: 18px; color: #6f8296; font-size: 11.5px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>CueKeeper</h1>
    <p id="status">正在启动工作台…</p>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <p class="hint">首次启动会请求辅助功能与输入监控权限</p>
  </main>
  <script>
    window.cuekeeperError = (message) => {
      const status = document.getElementById('status');
      status.textContent = message;
      status.classList.add('error');
      document.getElementById('spinner').hidden = true;
    };
  </script>
</body>
</html>
