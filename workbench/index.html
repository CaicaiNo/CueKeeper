<!doctype html>
<html lang="zh-CN" data-theme="cuekeeper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CueKeeper 工作台</title>
  <link rel="stylesheet" href="/vendor/daisyui.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
  <script type="module" src="/record.js"></script>
</head>
<body>
  <header class="topbar navbar">
    <div class="brand"><span class="mark" aria-hidden="true"></span>CueKeeper</div>
    <span class="topbar-divider" aria-hidden="true"></span>
    <h1>工作台</h1>
    <div class="tabs tabs-box mode-switch" role="tablist" aria-label="工作台模式">
      <button id="mode-edit" class="tab tab-active" type="button" role="tab" aria-selected="true">编辑流程</button>
      <button id="mode-batch" class="tab" type="button" role="tab" aria-selected="false">批量运行</button>
    </div>
    <span id="session-name" class="session-name"></span>
    <button id="template-button" class="btn btn-sm trailing" type="button">模板</button>
    <button id="import-button" class="btn btn-primary btn-sm" type="button">导入运行目录</button>
  </header>

  <main id="edit-workspace" class="workspace">
    <aside class="summary pane card" aria-labelledby="session-title">
      <h2 id="session-title" class="section-title card-title"><span class="sec">01</span>录制会话<span id="session-kind" class="badge badge-soft badge-sm" hidden></span></h2>
      <div id="summary"></div>
      <button id="app-picker" class="app-picker btn btn-sm" type="button" aria-haspopup="dialog" title="选择应用">
        <span id="app-picker-icon" class="app-picker-icon" aria-hidden="true"></span>
        <span id="app-picker-label" class="app-picker-label">全部应用</span>
        <span class="app-picker-chevron" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </button>
      <h3><span class="sec">02</span>前置条件</h3>
      <div id="setup" class="setup-list"></div>
    </aside>

    <section class="timeline-panel pane card" aria-labelledby="timeline-title">
      <div class="pane-header">
        <h2 id="timeline-title" class="card-title">动作时间线</h2>
        <span id="timeline-count" class="muted"></span>
        <label id="ignored-control" class="check-row trailing" hidden><input type="checkbox" id="show-ignored" class="checkbox checkbox-sm">显示已忽略</label>
      </div>
      <div class="timeline-columns" aria-hidden="true">
        <span></span><span>时间</span><span>类型</span><span>动作</span><span>耗时</span>
      </div>
      <div id="selection"></div>
      <div id="timeline" class="timeline-body" aria-label="会话动作"></div>
    </section>

    <aside class="inspector pane card" aria-label="动作整理与行为库">
      <div class="tabs tabs-box" aria-label="右侧面板">
        <button id="actions-tab" class="tab tab-active" type="button" aria-pressed="true">动作整理</button>
        <button id="library-tab" class="tab" type="button" aria-pressed="false">行为库</button>
      </div>
      <div id="inspector" class="inspector-body"></div>
    </aside>
  </main>

  <main id="batch-workspace" class="workspace" hidden>
    <aside class="summary pane card queue" aria-labelledby="queue-title">
      <div class="queue-head">
        <h2 id="queue-title" class="section-title card-title"><span class="sec">01</span>工作流队列</h2>
        <label class="check-row"><input id="batch-select-all" type="checkbox" class="checkbox checkbox-sm" checked>全选</label>
      </div>
      <div id="batch-queue" class="queue-list"></div>
      <p class="hint">串行执行：一条跑完才起下一条；每轮重新绑定窗口、复查前置条件，不复用上一轮状态。</p>
      <button id="batch-add" class="btn btn-sm queue-add" type="button">添加工作流</button>
    </aside>

    <section class="batch-panel pane card" aria-labelledby="batch-title">
      <div class="pane-header">
        <h2 id="batch-title" class="card-title">批次执行</h2>
        <span id="batch-count" class="muted"></span>
        <div class="button-group trailing">
          <button id="batch-export" class="btn btn-sm" type="button">导出汇总</button>
          <button id="batch-stop" class="btn btn-sm" type="button" disabled>停止</button>
          <button id="batch-start" class="btn btn-primary btn-sm" type="button">开始批次</button>
        </div>
      </div>
      <div class="batch-progress">
        <div class="track" role="progressbar" aria-label="批次进度"><span id="batch-progress-bar"></span></div>
        <span id="batch-progress-text" class="muted"></span>
      </div>
      <div id="batch-first-failure" class="batch-alert" hidden></div>
      <div class="batch-settings">
        <label class="field">轮次
          <input id="batch-rounds" class="input input-sm" type="number" min="1" max="500" step="1" value="20">
        </label>
        <label class="field">轮次间隔（秒）
          <input id="batch-interval" class="input input-sm" type="number" min="0" max="3600" step="1" value="2">
        </label>
        <label class="field">失败后
          <select id="batch-failure" class="select select-sm">
            <option value="continue" selected>继续下一轮</option>
            <option value="stop">停止批次</option>
          </select>
        </label>
        <label class="field">跑到
          <input id="batch-stop-at" class="input input-sm" type="time" aria-label="停止时间（可选）">
        </label>
      </div>
      <div class="batch-columns" aria-hidden="true">
        <span></span><span>工作流</span><span>应用</span><span>轮次</span><span>状态</span><span>最近耗时</span><span>最近失败步骤</span><span>报告</span>
      </div>
      <div id="batch-rows" class="batch-body" aria-label="批次执行"></div>
    </section>

    <aside class="inspector pane card" aria-label="运行详情">
      <div class="tabs tabs-box" aria-label="右侧面板">
        <button class="tab tab-active" type="button">运行详情</button>
      </div>
      <div id="batch-detail" class="inspector-body"></div>
    </aside>
  </main>

  <section id="batch-log" class="draft card log" aria-labelledby="batch-log-title" hidden>
    <div class="draft-header">
      <h2 id="batch-log-title" class="card-title">批次日志</h2>
      <span id="batch-log-counts" class="log-counts"></span>
      <div class="button-group trailing">
        <button id="batch-open-summary" class="btn btn-sm" type="button" disabled>打开汇总 JSON</button>
      </div>
    </div>
    <pre id="batch-log-body" class="log-body"></pre>
  </section>

  <section id="draft-section" class="draft card" aria-labelledby="draft-title">
    <div class="draft-header">
      <h2 id="draft-title" class="card-title">测试项草稿</h2>
      <input id="test-name" class="test-name input input-sm" aria-label="测试项名称" placeholder="测试项名称" maxlength="256" required>
      <span id="draft-count" class="muted"></span>
      <div class="button-group trailing">
        <button id="shell-button" class="btn btn-sm" type="button">插入 Shell</button>
        <button id="privilege-button" class="btn btn-sm" type="button" title="以管理员身份执行命令（root）">插入提权</button>
        <button id="save-button" class="btn btn-sm" type="button" disabled>保存</button>
        <button id="run-button" class="btn btn-primary btn-sm" type="button" disabled>运行测试项</button>
      </div>
    </div>
    <ol id="draft" class="draft-body"></ol>
  </section>

  <footer id="status" class="status" role="status" aria-live="polite">正在读取本地会话…</footer>
  <dialog id="dialog" class="modal" aria-labelledby="dialog-title"></dialog>
  <dialog id="v2-pick-dialog" class="modal" aria-labelledby="v2-pick-dialog-title"></dialog>
</body>
</html>
