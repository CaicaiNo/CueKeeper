name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and recorder
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript and check schemas
        run: pnpm build

      - name: Run tests
        run: |
          mkdir -p out
          set -o pipefail
          pnpm test 2>&1 | tee out/ci-test.log

      - name: Build macOS recorder
        run: pnpm build:recorder

      - name: Package unsigned release
        run: node scripts/package.mjs --skip-build --skip-recorder --out out/release

      - name: Smoke-test the packaged CLI
        run: |
          set -euo pipefail
          bin=$(echo out/release/cuekeeper-*/bin/cuekeeper)
          "$bin" --version
          "$bin" flow validate examples/textedit.flow.json --json

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: cuekeeper-unsigned-${{ github.sha }}
          path: |
            out/release/*.tar.gz
            out/release/*.sha256
            out/release/*-RELEASE.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ github.run_attempt }}
          path: |
            out/
            dist/
          if-no-files-found: ignore
          retention-days: 7
